<app-csr-with-title [title]="'Register'">
  <div class="root">
    <form class="root__body" #wrapForm [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="body__swap">
        <!--  -->
        @for(f of firstSwapFields; track f.id){
        <app-form-field-txt [f]="f" [ctrl]="getCtrl(f)" [focusOnMount]="f.name === 'firstName'" />
        }
      </div>

      <div class="body__btn">
        <app-btn-shadow [spanProps]="spanProps" [btnProps]="btnProps" [type]="'submit'" />
      </div>
    </form>
  </div>
</app-csr-with-title>

<app-portal>
  <ng-template #content>
    <div
      class="w-[250px] absolute tb"
      [style.top]="portalWhere()?.top"
      [style.left]="portalWhere()?.left"
    >
      ⚡ Teleported Toast
    </div>
  </ng-template>
</app-portal>
