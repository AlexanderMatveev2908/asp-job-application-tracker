<app-csr-with-title [title]="'Register'">
  <div class="root">
    <form class="root__form" [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="form__swapper">
        <div class="swapper__swap">
          <!--  -->
          @for(f of firstSwapFields; track f.id){
          <app-form-field-txt [f]="f" [ctrl]="getCtrl(f)" [focusOnMount]="f.name === 'firstName'" />
          }
        </div>
      </div>

      <div class="form__footer">
        <app-swap-btns />

        <div class="footer__submit">
          <app-btn-shadow [spanProps]="spanProps" [btnStateProps]="btnProps" [type]="'submit'" />
        </div>
      </div>
    </form>
  </div>
</app-csr-with-title>
