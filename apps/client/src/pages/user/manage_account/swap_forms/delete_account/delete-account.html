<div #tooltipRef class="fixed inset-0 z-50 bg-white"></div>

<div class="root">
  <div class="w-[250px]">
    <app-btn-shadow
      appUseSpanDir
      [type]="'button'"
      [listenersProps]="{
        onClick: onBtnCLick
      }"
      [spanProps]="spanProps"
      appUseIDsDir
    />
  </div>
</div>

<app-portal
  [coords]="{
    top: coords()?.top,
    left: coords()?.left
  }"
>
  <div class="w-full h-full tb z-50">
    <app-popup [staticProps]="popupStaticProps" [isPop]="useKitPop.isPop()"></app-popup>
  </div>
</app-portal>
