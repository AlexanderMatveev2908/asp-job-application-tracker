<div #tooltipRef></div>

<div class="root">
  <div class="w-[250px]">
    <app-btn-shadow
      appUseSpanDir
      [type]="'button'"
      [listenersProps]="{
        onClick: onBtnCLick
      }"
      [spanProps]="spanProps"
      appUseIDsDir
    />
  </div>
</div>

<app-portal
  [coords]="{
    top: coords()?.top,
    left: coords()?.left
  }"
>
  <ng-template #tpl>
    <app-popup [staticProps]="popupStaticProps" [isPop]="useKitPop.isPop()"></app-popup>
  </ng-template>
</app-portal>
