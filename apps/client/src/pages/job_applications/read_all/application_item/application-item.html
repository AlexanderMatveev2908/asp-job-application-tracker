<div class="root" [style.--clr]="cssTheme()">
  <div class="root__content">
    @for(s of pairsLabelSvg(); track s.id){
    <app-span [spanProps]="s" />
    }

    <div class="content__status_row">
      <div class="status_row__notes">
        <app-drop-abs
          appUseIDsDir
          [isOpen]="useDrop.isOpen()"
          [setIsOpen]="useDrop.setIsOpen"
          [closeOnMouseOut]="true"
          [spanProps]="spanNotes"
          [spanSizesProps]="{
            svg: 'lg'
          }"
          [additionalTwd]="'translate-x-full max-h-[250px] overflow-y-scroll'"
        >
          <ng-template #dropContent>
            <div class="w-[250px]">
              {{ application().notes || 'N/A' }}
            </div>
          </ng-template>
        </app-drop-abs>
      </div>
    </div>
  </div>
</div>
