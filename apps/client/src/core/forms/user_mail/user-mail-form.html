<app-form-shape
  [fromGroup]="form"
  [onSubmit]="onSubmit"
  [testId]="useKitStrategy.testId()"

  [useFullPage]="useKitStrategy.useFullPage()"
>

    <app-form-field-txt
      [f]="mailField"
      [ctrl]="ctrl"
      [focusOnMount]="useKitStrategy.useFullPage()"
    />
  </div>
</app-form-shape>
