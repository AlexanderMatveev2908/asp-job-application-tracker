<app-swap-item [title]="'TOTP'">
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="root">
    <div class="root__content">
      @for (part of partsFields; track part.id; let outerIdx = $index){
      <div class="content__group">
        @for(f of part.fields; track f.id; let innerIdx = $index;){

        <div class="group__field">
          <input
            type="text"
            class="field__box txt__xl"
            [formControl]="formCtrl(outerIdx, innerIdx)"
            maxlength="1"
            [attr.data-field]="f.field"
          />
        </div>
        }
      </div>

      }
    </div>

    <app-form-submit appUseIDsDir [isPending]="false" />
  </form>
</app-swap-item>
