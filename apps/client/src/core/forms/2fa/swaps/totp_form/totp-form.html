<app-swap-item [title]="'TOTP'">
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="root">
    <div class="root__wrap">
      <div class="wrap__content">
        @for (part of partsFields; track part.id; let outerIdx = $index){
        <app-totp-part
          [outerIdx]="outerIdx"
          [part]="part"
          [formCtrl]="formCtrl"
          [selectAll]="useTotpKeys.selectAll()"
        />
        }

        <app-form-field-err
          appUseIDsDir
          appUseFormFieldDir
          [ctrl]="getCtrl('totp')"
          [testId]="'totp_root'"
        />
      </div>

      <app-form-submit appUseIDsDir [isPending]="false" />
    </div>
  </form>
</app-swap-item>
