<app-csr-with-title [title]="'2FA'">
  <div class="root">
    <div class="root__swapper">
      <app-swapper
        [swap]="swapState().swap"
        [setSwap]="setSwap"
        [maxSwaps]="2"
        [prefixTestId]="'form_2fa'"
      >
        <div #swapDiv class="swapper__swap" [style.--opa]="getOpacity(0)()">
          <app-totp-form [strategy]="strategy()" />
        </div>
        <div #swapDiv class="swapper__swap" [style.--opa]="getOpacity(1)()">
          <app-bkp-form [strategy]="strategy()" />
        </div>
      </app-swapper>
    </div>
  </div>
</app-csr-with-title>
