<div class="root">

    <app-form-field-txt
      appUseFormFieldDir
      [ctrl]="getCtrl('companyName')"
      [f]="first2Rows[0]"

    />

    <app-form-field-txt appUseFormFieldDir [ctrl]="getCtrl('positionName')" [f]="first2Rows[1]" />

  <app-form-submit [isPending]="apiTracker.isPending()" appUseIDsDir />
