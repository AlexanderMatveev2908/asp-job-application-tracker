<div class="root" [attr.data-testid]="prefixTestId() + '__swapper'">
  <div
    class="root__swapper"
    [style.--cols]="maxSwaps()"
    [style.--perc]="transform()"
    [style.max-height]="maxH()"
  >
    <ng-content />
  </div>

  <div class="root__footer">
    <app-swap-btns
      [swap]="swap()"
      [setSwap]="setSwap()"
      [maxSwaps]="maxSwaps()"
      [prefixTestId]="prefixTestId()"
    />
  </div>
</div>
