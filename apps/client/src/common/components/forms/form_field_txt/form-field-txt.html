<div class="root">
  <div class="root__label">
    <span class="txt__lg">{{ f().label }}</span>
  </div>

  <div class="root__input">
    <input
      [attr.data-field]="f().field"
      #inputTxt
      [formControl]="ctrl()"
      class="txt__md"
      [type]="f().type"
      [placeholder]="f().place"
    />
    <app-form-field-err [ctrl]="ctrl()" />
  </div>
</div>
