<app-wrap-btn-api [isPending]="btnStateProps().isPending" [eventT]="spanProps().eventT">
  <button
    (click)="onClick()"
    [type]="type()"
    [attr.data-testid]="testId()"
    class="root"
    [style.--clr]="metaEvent().css"
    [style.--pad]="paddingProps()"
    [disabled]="btnStateProps().isDisabled"
  >
    <app-span [spanProps]="spanProps()" [sizesProps]="spanSizesProps()" />
  </button>
</app-wrap-btn-api>
