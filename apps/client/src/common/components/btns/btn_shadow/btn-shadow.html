<app-wrap-btn-api [props]="wrapBtnApiProps()">
  <button
    (click)="onClick()"
    [type]="type()"
    [attr.data-testid]="testId()"
    class="root btn__res"
    [style.--clr]="metaEvents().css"
    [style.padding]="paddingProps()"
    [disabled]="btnStateProps().isDisabled"
  >
    <app-span [spanProps]="spanProps()" [sizesProps]="spanSizesProps()" />
  </button>
</app-wrap-btn-api>
