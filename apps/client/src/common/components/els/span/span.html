<div class="root">
  @let Svg = spanProps().Svg;
  <!--  -->
  @if (Svg) {
  <div [class]="svgCls()">
    <ng-container *ngComponentOutlet="Svg; inputs: {}" />
  </div>
  }
  <!--  -->
  @let label =spanProps().label;
  <!--  -->
  @if(label){
  <span [class]="txtCls()">{{ label }}</span>
  }
</div>
