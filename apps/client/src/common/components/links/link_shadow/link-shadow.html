@if(isExternal()){
<a
  [attr.href]="path()"
  [attr.target]="'_blank'"
  [attr.rel]="'noopener noreferrer'"
  class="root"
  [style.--clr]="metaEvent().css"
  [style.--pad]="paddingProps()"
>
  <ng-container *ngTemplateOutlet="content"></ng-container>
</a>
}@else {
<a
  [routerLink]="path()"
  class="root"
  [style.--clr]="metaEvent().css"
  [style.--pad]="paddingProps()"
>
  <ng-container *ngTemplateOutlet="content"></ng-container>
</a>
}

<ng-template #content>
  <app-span
    [spanProps]="{
      label: spanProps().label,
      Svg: spanProps().Svg ?? null
    }"
  />
</ng-template>
