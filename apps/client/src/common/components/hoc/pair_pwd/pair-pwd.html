<div class="root">
  <!--  -->
  @for(f of [pwdField(),confPwdField()]; track f.id; let idx = $index){

  <app-form-field-txt
    [f]="f"
    [ctrl]="getCtrl()(f)"
    [onSvgClick]="toggleByKey(idx ? 'isConfirmPwdTypePwd' : 'isPwdTypePwd')"
  />
  <!--  -->
  @if(idx === 0){
  <app-pwd-generator [confSwap]="confSwap()" />
  } }
</div>
