<div class="root">
  <app-form-field-txt
    [f]="pwdField()"
    [ctrl]="getCtrl()(pwdField())"
    [onSvgClick]="toggleByKey('isPwdTypePwd')"
  />
  <app-pwd-generator [confSwap]="confSwap()" />

  <app-form-field-txt
    [f]="confPwdField()"
    [ctrl]="getCtrl()(confPwdField())"
    [onSvgClick]="toggleByKey('isConfirmPwdTypePwd')"
  />
</div>
