<div class="root">
  <button
    #btn
    (focus)="onHover()"
    (blur)="onLeave()"
    (mouseover)="onHover()"
    (mouseleave)="onLeave()"
    type="button"
    class="root__btn tb"
  >
    <div class="text-gray-300 svg__2xl">
      <ng-container *ngComponentOutlet="Svg" />
    </div>
  </button>
</div>

<app-portal
  [coords]="{
    top: coords()?.top,
    left: coords()?.left
  }"
>
  <ng-template #tpl>
    <div class="absolute w-[300px] z-50 tb">
      Lorem ipsum, dolor sit amet consectetur adipisicing elit. Voluptatum omnis minus inventore
    </div>
  </ng-template>
</app-portal>
