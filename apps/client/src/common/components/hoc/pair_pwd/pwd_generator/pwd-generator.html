<div class="root">
  <button
    #tooltipRef
    (click)="genPwd()"
    (focus)="onHover()"
    (blur)="onLeave()"
    (mouseover)="onHover()"
    (mouseleave)="onLeave()"
    type="button"
    class="root__btn"
  >
    <div class="text-gray-300 svg__2xl">
      <ng-container *ngComponentOutlet="Svg" />
    </div>
  </button>

  <app-cpy-paste [txt]="pwd()" [confSwap]="confSwap()" />
</div>

<!-- ! avoid starting animation when mode is still 'swapping' -->
@if(showTooltip() ){
<app-portal
  [coords]="{
    top: coords()?.top,
    left: coords()?.left
  }"
>
  <ng-template #tpl>
    <div class="z-50 -translate-x-3/4 -translate-y-[20px] absolute w-[300px]">
      <app-tooltip [isHover]="isHover()" [eventT]="'NONE'" [msg]="'Generate Password'" />
    </div>
  </ng-template>
</app-portal>
}
