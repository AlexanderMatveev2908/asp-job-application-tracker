<div #drop class="root">
  <button class="root__btn" (click)="setIsDropOpen()(!isOpen())">
    <app-span [spanProps]="spanProps()" [sizesProps]="spanSizesProps()" />
  </button>

  <div class="root__content" [ngClass]="translation()">
    <ng-container *ngTemplateOutlet="dropContentRef" />
  </div>
</div>
