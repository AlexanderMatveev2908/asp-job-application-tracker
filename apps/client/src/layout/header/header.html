<div class="root z__header">
  <div class="root__left">
    <a routerLink="/" class="svg__2xl app__clr">
      <app-svg-fill-ghost />
    </a>
  </div>

  <div class="root__right">
    <button class="svg__3xl app__clr">
      <app-svg-stroke-user-write />
    </button>

    <button
      [ngClass]="isOpen() ? 'text-red-600 svg__3xl' : 'text-gray-300 hover:text-blue-600 svg__4xl'"
      (click)="handleToggle()"
    >
      @if (isOpen()) {
      <app-svg-fill-close />
      } @else {
      <app-svg-stroke-burger />
      }
    </button>
  </div>
</div>
