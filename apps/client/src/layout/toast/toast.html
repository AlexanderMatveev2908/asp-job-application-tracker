@if(isClient){
<ng-container *ngTemplateOutlet="toast" />
}

<ng-template #toast>
  <div class="root z__toast" [style.--clr]="eventMeta().css">
    <div class="root__close_row">
      <button class="close_row__btn svg__lg">
        <app-close />
      </button>
    </div>

    <div class="root__status_row" [style.--clr]="eventMeta().css">
      <div class="status_row__status">
        <span class="txt__3xl">200</span>
      </div>
    </div>

    <div class="root__content">
      <span #msgContainer class="txt__lg content__msg">{{ toastState().msg }}</span>
    </div>
  </div>
</ng-template>
