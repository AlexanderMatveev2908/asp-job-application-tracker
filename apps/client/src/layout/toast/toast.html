@if(isClient){
<ng-container *ngTemplateOutlet="toastTpl" />
}

<ng-template #toastTpl>
  <div #toast class="root z__toast" [style.--clr]="eventMeta().css">
    <div class="root__close_row">
      <button (click)="closeClick()" class="close_row__btn svg__lg">
        <app-close />
      </button>
    </div>

    <div class="root__status_row" [style.--clr]="eventMeta().css">
      <div class="status_row__status">
        <span class="txt__3xl">{{ toastState().status }}</span>
      </div>
    </div>

    <div class="root__content">
      <span #msgContainer class="txt__lg content__msg">{{ trimmedMsg() }}</span>
    </div>

    <div #timerToast class="root__timer" [style.--clr]="eventMeta().css"></div>
  </div>
</ng-template>
